name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Java JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Build Web App & Capacitor Android Project
        run: |
          npm install -g @capacitor/cli @capacitor/core
          npx cap init "Yogesh Chat" "com.yogesh.chat" --web-dir public
          npx cap add android
          npx cap copy

      - name: Configure Android Server URL
        run: |
          echo '<?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
              <base-config cleartextTrafficPermitted="true" />
          </network-security-config>' > android/app/src/main/res/xml/network_security_config.xml

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v3
        with:
          name: YogeshChat-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
